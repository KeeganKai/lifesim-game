<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSim AI - Unlimited</title>
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0;
            --accent: #bb86fc; --success: #03dac6; --danger: #cf6679;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
            max-width: 800px; margin: 0 auto; padding: 20px;
        }
        h1 { color: var(--accent); text-align: center; }
        .stats-container {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; margin-bottom: 20px;
        }
        .stat-box {
            background: var(--panel); padding: 15px;
            border-radius: 8px; text-align: center; font-weight: bold;
        }
        .event-log {
            background: var(--panel); padding: 20px; border-radius: 8px;
            height: 300px; overflow-y: auto; margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }
        .actions {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        button {
            background: var(--panel); color: var(--text);
            border: 1px solid var(--accent); padding: 15px;
            border-radius: 8px; cursor: pointer; font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background: var(--accent); color: var(--bg); }
        .danger-btn { border-color: var(--danger); color: var(--danger); }
        .danger-btn:hover { background: var(--danger); color: white; }
        
        .footer-controls {
            margin-top: 20px; display: flex; justify-content: space-between;
        }
        input[type="text"] {
            padding: 10px; border-radius: 4px; border: none;
            background: var(--panel); color: var(--text);
        }
    </style>
</head>
<body>

    <h1>LifeSim AI</h1>
    
    <div class="stats-container">
        <div class="stat-box" id="stat-age">Age: 0</div>
        <div class="stat-box" id="stat-health">Health: 100%</div>
        <div class="stat-box" id="stat-happiness">Happiness: 100%</div>
        <div class="stat-box" id="stat-money">Money: $0</div>
    </div>

    <div class="event-log" id="event-log">
        <p>Welcome to your new life. What will you do?</p>
    </div>

    <div class="actions">
        <button onclick="takeAction('Age Up')">Age Up (+1 Year)</button>
        <button onclick="takeAction('Study')">Study / Learn</button>
        <button onclick="takeAction('Work')">Work / Hustle</button>
        <button onclick="takeAction('Relax')">Relax / Socialize</button>
    </div>

    <div class="footer-controls">
        <div>
            <input type="text" id="cheat-code" placeholder="Enter cheat code...">
            <button onclick="applyCheat()" style="padding: 10px;">Apply</button>
        </div>
        <button class="danger-btn" onclick="newLife()">Start New Life</button>
    </div>

<script>
    // --- STATE MANAGEMENT & AUTO-SAVE ---
    let state = {
        age: 0, health: 100, happiness: 100, money: 0, logs: []
    };

    // Load progress from browser's local storage (no login needed)
    function loadGame() {
        const saved = localStorage.getItem('lifesim_save');
        if (saved) {
            state = JSON.parse(saved);
            updateUI();
            renderLogs();
        }
    }

    // Auto-save function
    function saveGame() {
        localStorage.setItem('lifesim_save', JSON.stringify(state));
    }

    // End everything and restart
    function newLife() {
        if(confirm("Are you sure? This will end your current life permanently.")) {
            localStorage.removeItem('lifesim_save');
            location.reload();
        }
    }

    // --- GAME ENGINE ---
    function updateUI() {
        document.getElementById('stat-age').innerText = `Age: ${state.age}`;
        document.getElementById('stat-health').innerText = `Health: ${state.health}%`;
        document.getElementById('stat-happiness').innerText = `Happiness: ${state.happiness}%`;
        document.getElementById('stat-money').innerText = `Money: $${state.money.toLocaleString()}`;
    }

    function addLog(message) {
        state.logs.push(`[Age ${state.age}] ${message}`);
        renderLogs();
        saveGame();
    }

    function renderLogs() {
        const logBox = document.getElementById('event-log');
        logBox.innerHTML = state.logs.map(log => `<p>${log}</p>`).join('');
        logBox.scrollTop = logBox.scrollHeight; // Auto-scroll to bottom
    }

    // --- AI & EVENT SYSTEM ---
    // If you want true LLM AI, you would replace this logic with a fetch() call to an API.
    async function takeAction(action) {
        if (state.health <= 0) {
            alert("You have passed away. Start a new life.");
            return;
        }

        let eventMessage = "";
        
        // Apply base stats based on action
        if (action === 'Age Up') {
            state.age += 1;
            state.health -= Math.floor(Math.random() * 3);
            eventMessage = `You grew older. ${generateProceduralEvent('random')}`;
        } else if (action === 'Study') {
            state.happiness -= 5;
            eventMessage = generateProceduralEvent('study');
        } else if (action === 'Work') {
            state.health -= 5;
            state.happiness -= 5;
            let earned = (state.age * 100) + Math.floor(Math.random() * 500);
            state.money += earned;
            eventMessage = `You worked hard and earned $${earned}. ${generateProceduralEvent('work')}`;
        } else if (action === 'Relax') {
            state.happiness += 10;
            state.health += 5;
            state.money -= 50;
            eventMessage = generateProceduralEvent('relax');
        }

        // Keep stats in bounds
        if (state.health > 100) state.health = 100;
        if (state.happiness > 100) state.happiness = 100;
        if (state.happiness < 0) state.happiness = 0;

        // Death check
        if (state.age > 100 && Math.random() < 0.1) {
            state.health = 0;
            eventMessage = "You passed away peacefully from old age.";
        }

        addLog(eventMessage);
        updateUI();
        saveGame();
    }

    // Placeholder for AI: Procedural Generator
    function generateProceduralEvent(type) {
        const studyEvents = ["You read a fascinating book on quantum physics.", "You learned a new programming language.", "You fell asleep in the library."];
        const workEvents = ["Your boss praised your effort.", "You spilled coffee on your keyboard.", "You networked with an industry professional."];
        const relaxEvents = ["You watched a great movie.", "You took a long walk in the park.", "You spent time scrolling on your phone."];
        const randomEvents = ["You found $20 on the ground!", "You caught a slight cold.", "You pondered the meaning of life."];

        let arrayToUse = randomEvents;
        if (type === 'study') arrayToUse = studyEvents;
        if (type === 'work') arrayToUse = workEvents;
        if (type === 'relax') arrayToUse = relaxEvents;

        // If you integrate an AI API, put the fetch() call here and return the AI text instead.
        return arrayToUse[Math.floor(Math.random() * arrayToUse.length)];
    }

    // --- CHEAT CODES ---
    function applyCheat() {
        const code = document.getElementById('cheat-code').value.toUpperCase();
        if (code === 'MOTHERLODE') {
            state.money += 50000;
            addLog("Cheat Activated: Added $50,000.");
        } else if (code === 'GODMODE') {
            state.health = 999;
            state.happiness = 999;
            addLog("Cheat Activated: Health and Happiness maxed out.");
        } else if (code === 'TIMEWARP') {
            state.age += 10;
            addLog("Cheat Activated: Aged up 10 years.");
        } else {
            addLog("Invalid cheat code.");
        }
        document.getElementById('cheat-code').value = '';
        updateUI();
        saveGame();
    }

    // Init
    loadGame();
    if (state.logs.length === 0) updateUI();
</script>
</body>
</html>
